<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orion Vibrant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600;800&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  @property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

  :root {
    /* Night sky from the tide icon, pushed toward purple. */
    --bg: #0c0920;
    --panel: #120d2b;
    --surface: #1b1442;
    --surface-2: #251c57;
    --line: rgb(255 255 255 / 0.07);
    --line-2: rgb(255 255 255 / 0.14);
    --ink: #f4f0ff;
    --body: #d4cdf3;
    --muted: #a39bcc;
    --faint: #6c6497;

    /* The icon's four inks, plus a warm and a hot one for review and blockers. */
    --teal: #18d6c0;
    --blue: #3b6cff;
    --violet: #b45cff;
    --pink: #ff8fa3;
    --amber: #ffb347;
    --red: #ff5e7e;
    --magenta: #d94dff;

    --st-ready: var(--teal);
    --st-you: #c98bff;
    --st-review: var(--amber);
    --st-blocked: var(--red);
    --st-done: #7d73a8;
    --st-expected: #8f86bd;
    --st-gate: #ffd166;

    /* Medium rounding: soft enough to feel friendly, tight enough to feel like a tool. */
    --r-xs: 3px;
    --r-sm: 5px;
    --r-md: 8px;
    --r-lg: 12px;

    --font-display: 'Unbounded', system-ui, sans-serif;
    --font-ui: 'Schibsted Grotesk', system-ui, -apple-system, sans-serif;
    --font-data: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.4 var(--font-ui);
    display: grid;
    grid-template-columns: 264px 1fr;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }
  button { font: inherit; color: inherit; }

  /* ── Sidebar, in the dense style of an editor ───── */
  .side {
    background:
      radial-gradient(120% 220px at 0% 0%, rgb(180 92 255 / 0.14), transparent 70%),
      var(--panel);
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--line);
    font-size: 13px;
  }
  .side-head { height: 52px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 10px; border-bottom: 1px solid var(--line); }
  .ws-switch {
    flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px;
    border: 0; border-radius: var(--r-sm); background: none; cursor: pointer; font-weight: 700; font-size: 13.5px; text-align: left;
  }
  .ws-switch:hover, .icon-btn:hover { background: rgb(255 255 255 / 0.06); }
  .ws-switch img { width: 22px; height: 22px; border-radius: var(--r-xs); image-rendering: pixelated; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12); }
  .ws-switch span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ws-switch svg, .icon-btn svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .icon-btn { width: 28px; height: 28px; border: 0; border-radius: var(--r-sm); background: none; display: grid; place-items: center; cursor: pointer; }

  .side-body { flex: 1; overflow: auto; padding: 8px 6px; }
  .row {
    position: relative; width: 100%; height: 28px; display: flex; align-items: center; gap: 9px; padding: 0 8px;
    border: 0; border-radius: var(--r-sm); background: none; color: var(--body); cursor: pointer; text-align: left;
    font: 500 13px var(--font-ui); white-space: nowrap;
  }
  .row:hover { background: rgb(255 255 255 / 0.045); color: var(--ink); }
  .row.on { background: rgb(180 92 255 / 0.16); color: var(--ink); }
  .row.on::before { content: ''; position: absolute; left: -6px; top: 6px; bottom: 6px; width: 2px; border-radius: 0 2px 2px 0; background: var(--violet); box-shadow: 0 0 8px var(--violet); }
  .row > svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .row.on > svg { color: var(--st-you); }
  .row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font: 500 11px var(--font-data); color: var(--faint); }
  .row .meta.hot { color: var(--st-you); }
  kbd {
    font: 500 10.5px var(--font-data); color: var(--faint); padding: 1px 5px; border-radius: var(--r-xs);
    border: 1px solid var(--line-2); background: rgb(255 255 255 / 0.03);
  }
  .row.primary {
    height: 32px; margin-bottom: 2px; color: var(--ink); font-weight: 600;
    background: linear-gradient(90deg, rgb(180 92 255 / 0.22), rgb(59 108 255 / 0.12));
    box-shadow: inset 0 0 0 1px rgb(180 92 255 / 0.35);
  }
  .row.primary > svg { color: var(--st-you); }
  .row.primary:hover { background: linear-gradient(90deg, rgb(180 92 255 / 0.3), rgb(59 108 255 / 0.18)); }
  .side-gap { height: 12px; }

  .section-head {
    height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 6px; margin-top: 4px;
    font: 700 10.5px var(--font-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint);
  }
  .section-head .spacer { flex: 1; }
  .section-head .icon-btn { width: 22px; height: 22px; }
  .section-head .icon-btn svg { width: 14px; height: 14px; }
  .caret { width: 12px; height: 12px; flex: none; color: var(--faint); transition: transform 0.15s; }
  .open > .row .caret { transform: rotate(90deg); }
  .swatch { width: 14px; height: 14px; border-radius: 3px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.1); }
  .swatch img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .tree-kids { display: none; position: relative; }
  .open > .tree-kids { display: block; }
  .tree-kids::before { content: ''; position: absolute; left: 21px; top: 2px; bottom: 2px; width: 1px; background: var(--line-2); }
  .tree-kids .row { padding-left: 34px; height: 26px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); }
  .dot.lit { box-shadow: 0 0 0 3px color-mix(in oklab, var(--c) 25%, transparent), 0 0 10px var(--c); }
  .dot.hollow { background: none; border: 1.5px dashed var(--c); }
  .dot.wait { background: none; border: 1.5px solid var(--c); }

  .notice {
    margin: 0 8px 8px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; border-radius: var(--r-md);
    position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line-2);
  }
  .notice img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.35; image-rendering: pixelated; }
  .notice > *:not(.bg) { position: relative; }
  .notice svg { width: 16px; height: 16px; color: var(--teal); flex: none; }
  .notice-text { flex: 1; min-width: 0; }
  .notice b { display: block; font-size: 12.5px; }
  .notice small { color: var(--muted); font-size: 11.5px; }
  .notice button { border: 0; border-radius: var(--r-sm); padding: 4px 8px; background: rgb(255 255 255 / 0.1); font: 600 12px var(--font-ui); cursor: pointer; }
  .me { flex: none; height: 48px; display: flex; align-items: center; gap: 9px; padding: 0 8px 0 12px; border-top: 1px solid var(--line); }
  .me .avatar { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; }
  .me .avatar img { width: 100%; height: 100%; image-rendering: pixelated; }
  .me-text { flex: 1; min-width: 0; line-height: 1.2; }
  .me b { display: block; font-size: 13px; }
  .me small { color: var(--muted); font-size: 11.5px; display: flex; align-items: center; gap: 5px; }
  .me small i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 6px var(--teal); }

  /* ── Main ───────────────────────────────────────── */
  main { overflow: auto; min-width: 0; position: relative; }
  .top {
    position: sticky; top: 0; z-index: 20; height: 52px; padding: 0 28px;
    display: flex; align-items: center; gap: 16px;
    background: rgb(12 9 32 / 0.55); backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--line);
  }
  .wordmark { display: flex; align-items: center; gap: 10px; font: 800 17px var(--font-display); letter-spacing: 0.08em; font-style: italic; }
  .crumb { color: var(--muted); font-weight: 600; }
  .top .spacer { flex: 1; }
  .pill-btn {
    height: 32px; padding: 0 12px; border-radius: var(--r-sm); border: 0; cursor: pointer;
    background: rgb(255 255 255 / 0.08); font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  .pill-btn.hot { background: linear-gradient(135deg, var(--violet), var(--blue)); box-shadow: 0 6px 20px -6px var(--violet); }
  .pill-btn[aria-pressed='true'] { background: rgb(24 214 192 / 0.18); color: var(--teal); }

  .hero {
    position: relative; height: 320px; overflow: hidden;
    background: linear-gradient(112deg, #c43cff 0%, #6a22d6 22%, #2a1577 48%, #140d3a 72%, var(--bg) 100%);
  }
  .hero-fx { position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0.55; }
  .hero::after { content: ''; position: absolute; inset: auto 0 0 0; height: 120px; background: linear-gradient(transparent, var(--bg)); }
  .hero-copy { position: absolute; left: 44px; top: 64px; z-index: 2; }
  .hero h1 {
    margin: 0; font: 800 46px/1 var(--font-display); letter-spacing: -0.01em; font-style: italic; text-transform: uppercase;
    text-shadow: 0 2px 24px rgb(80 0 160 / 0.5);
  }
  .hero .who { display: flex; align-items: center; gap: 20px; margin-top: 22px; }
  .hero .who .avatar { width: 72px; height: 72px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 4px rgb(255 255 255 / 0.12); }
  .hero .who .avatar img { width: 100%; height: 100%; image-rendering: pixelated; }
  .hero .who strong { font: 300 50px/1 var(--font-display); letter-spacing: -0.02em; }
  .hero .chips { display: flex; gap: 8px; margin-top: 22px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border-radius: var(--r-sm);
    background: rgb(7 5 26 / 0.45); backdrop-filter: blur(8px); font-weight: 700; font-size: 13px; border: 1px solid var(--line-2);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .belt { position: absolute; right: 6%; top: 34px; width: 470px; height: 260px; z-index: 1; }
  .belt svg { position: absolute; inset: 0; filter: drop-shadow(0 0 18px rgb(255 255 255 / 0.55)); }
  .planet { position: absolute; border-radius: 50%; overflow: hidden; animation: float 7s ease-in-out infinite; }
  .planet img { width: 100%; height: 100%; image-rendering: pixelated; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(4deg); } }

  section.block { padding: 8px 44px 28px; position: relative; z-index: 2; }
  .block h2 {
    font: 800 22px var(--font-display); font-style: italic; text-transform: uppercase; letter-spacing: 0.01em;
    margin: 14px 0 18px; display: flex; align-items: baseline; gap: 14px;
  }
  .block h2 small { font: 600 13px var(--font-ui); font-style: normal; text-transform: none; color: var(--muted); letter-spacing: 0; }

  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
  .tile {
    border-radius: var(--r-lg); overflow: hidden; background: var(--panel); border: 1px solid var(--line);
    transition: transform 0.25s, box-shadow 0.25s; cursor: pointer;
  }
  .tile:hover { transform: translateY(-4px); box-shadow: 0 24px 50px -20px rgb(180 92 255 / 0.45); }
  .tile-art { position: relative; height: 210px; overflow: hidden; }
  .tile-art img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .tile-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 55%, var(--panel)); }
  .tile-art .tag {
    position: absolute; left: 18px; top: 18px; z-index: 1; padding: 4px 8px; border-radius: var(--r-xs);
    background: #fff; color: #120a26; font: 800 11px var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase;
  }
  .tile-body { padding: 4px 22px 22px; }
  .tile-body small { color: var(--muted); font-size: 13px; }
  .tile-body h3 { margin: 4px 0 6px; font: 700 20px/1.2 var(--font-ui); }
  .tile-body p { margin: 0 0 16px; color: var(--body); font-size: 14px; }
  .bar { height: 6px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--teal), var(--blue), var(--violet)); }
  .tile-foot { display: flex; justify-content: space-between; margin-top: 10px; font: 600 12px var(--font-data); color: var(--muted); }

  /* ── Canvas ─────────────────────────────────────── */
  .canvas {
    position: relative; margin: 0 28px 44px; border-radius: var(--r-lg); overflow: auto; height: 1000px;
    background:
      radial-gradient(60% 50% at 20% 10%, rgb(180 92 255 / 0.16), transparent 70%),
      radial-gradient(50% 40% at 85% 80%, rgb(24 214 192 / 0.10), transparent 70%),
      #0a0719;
    border: 1px solid var(--line);
  }
  .canvas-fx { position: absolute; inset: 0; opacity: 0.5; pointer-events: none; }
  .world { position: relative; width: 1288px; height: 1028px; margin: 24px; zoom: 0.88; }
  .world::before {
    content: ''; position: absolute; inset: -26px;
    background-image: radial-gradient(rgb(255 255 255 / 0.09) 1px, transparent 1.4px);
    background-size: 28px 28px;
  }
  .edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 1; }
  .edges path { fill: none; stroke-width: 2.5; stroke-linecap: round; }
  .edges .settled { stroke: #3c3370; }
  .edges .hot { stroke: var(--teal); stroke-width: 3; }
  .edges .hot-base { stroke: var(--teal); stroke-opacity: 0.45; stroke-width: 8; filter: blur(4px); }
  .edges .hot-flow { stroke: #fff; stroke-width: 3; stroke-dasharray: 2 12; animation: flow 1.1s linear infinite; }
  .edges .blocked { stroke: var(--red); stroke-dasharray: 8 7; stroke-opacity: 0.8; }
  .edges .related { stroke: var(--faint); stroke-dasharray: 1 7; stroke-width: 3; }
  .edges .gate { stroke: var(--st-gate); stroke-opacity: 0.7; }
  @keyframes flow { to { stroke-dashoffset: -24; } }

  .group {
    position: absolute; border-radius: var(--r-lg); overflow: hidden; z-index: 0;
    background: linear-gradient(180deg, rgb(255 255 255 / 0.035), rgb(255 255 255 / 0.015));
    border: 1px solid var(--line);
  }
  .group-banner { position: relative; height: 84px; }
  .group-banner img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; opacity: 0.85; }
  .group-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(10 7 25 / 0.85) 15%, rgb(10 7 25 / 0.2) 60%, rgb(10 7 25 / 0.6)), linear-gradient(transparent 40%, rgb(10 7 25 / 0.9)); }
  .group-head { position: absolute; left: 28px; right: 28px; top: 18px; z-index: 1; display: flex; align-items: center; gap: 18px; }
  .group-head h3 { margin: 0; font: 800 20px var(--font-display); font-style: italic; letter-spacing: 0.01em; }
  .group-head p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  .group-head .prog { margin-left: auto; text-align: right; font: 600 12px var(--font-data); color: var(--muted); }
  .group-head .prog .bar { width: 160px; margin-top: 6px; }

  /* Cards share one size, like a hand of trading cards, and differ in art, color, and frame. */
  .card {
    position: absolute; width: 240px; height: 336px; z-index: 2;
    transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px));
    transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    cursor: grab;
  }
  .card:hover { --lift: -6px; transition-duration: 0.12s; z-index: 5; }
  .glow {
    position: absolute; inset: -5px; border-radius: 13px; z-index: -1; opacity: 0;
    background: conic-gradient(from var(--spin), var(--violet), var(--pink), var(--teal), var(--blue), var(--violet));
    filter: blur(16px);
  }
  .card.you .glow { opacity: 0.6; animation: spin 5s linear infinite; }
  @keyframes spin { to { --spin: 360deg; } }
  .frame {
    height: 100%; border-radius: var(--r-md); padding: 2px;
    background: linear-gradient(155deg, color-mix(in oklab, var(--st) 90%, white), color-mix(in oklab, var(--c1) 35%, #1a1240) 40%, color-mix(in oklab, var(--c2) 30%, #1a1240) 70%, var(--st));
    box-shadow: 0 22px 44px -14px rgb(0 0 0 / 0.75);
  }
  .card-inner {
    position: relative; height: 100%; border-radius: 6px; overflow: hidden;
    background:
      radial-gradient(120% 60% at 50% 0%, color-mix(in oklab, var(--c1) 26%, transparent), transparent 70%),
      linear-gradient(180deg, #1a1344, #120d30 65%);
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .card-title { display: flex; align-items: flex-start; gap: 8px; min-height: 38px; padding: 2px 2px 0; }
  .card-title h3 {
    margin: 0; flex: 1; font: 700 15px/1.22 var(--font-ui); letter-spacing: -0.005em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cost {
    flex: none; font: 600 11px/1 var(--font-data); padding: 5px 7px; border-radius: var(--r-xs);
    background: rgb(255 255 255 / 0.08); color: var(--body); border: 1px solid var(--line);
  }
  .art {
    position: relative; flex: none; width: 216px; height: 130px; border-radius: var(--r-xs); overflow: hidden;
    background: #0d0a22; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08);
  }
  .art img, .art .live { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; transition: opacity 0.35s; }
  .art::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(120% 95% at 50% 35%, transparent 55%, rgb(5 3 18 / 0.55)); }
  .art-status {
    position: absolute; top: 8px; right: 8px; z-index: 3; padding: 4px 7px; border-radius: var(--r-xs);
    background: var(--st); color: #140a2b; font: 800 10px/1 var(--font-ui); letter-spacing: 0.07em; text-transform: uppercase;
    box-shadow: 0 2px 10px rgb(0 0 0 / 0.4);
  }
  .emblem {
    position: absolute; left: 8px; bottom: 8px; z-index: 3; display: flex; align-items: center; gap: 6px;
    padding: 3px 8px 3px 3px; border-radius: var(--r-sm); background: rgb(8 6 26 / 0.72); backdrop-filter: blur(6px);
    font: 600 11.5px var(--font-ui); color: var(--ink);
  }
  .emblem i {
    width: 20px; height: 20px; border-radius: var(--r-xs); display: grid; place-items: center;
    background: linear-gradient(135deg, var(--c1), var(--c2)); color: #140a2b; font: 800 10px var(--font-display); font-style: normal;
  }
  .typeline {
    display: flex; align-items: center; gap: 6px; padding: 7px 2px; border-block: 1px solid var(--line);
    font: 700 10px var(--font-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted);
  }
  .typeline svg { width: 13px; height: 13px; flex: none; }
  .typeline .gem { margin-left: auto; width: 9px; height: 9px; transform: rotate(45deg); border-radius: 2px; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 0 8px var(--c1); }
  .text { margin: 0; flex: 1; font: 400 12.5px/1.45 var(--font-ui); color: var(--body); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; padding: 0 2px; }
  .text.flavor { font-style: italic; color: var(--faint); }
  .card footer { display: flex; align-items: center; gap: 8px; font: 600 11px var(--font-data); color: var(--muted); padding: 0 2px; }
  .add { color: var(--teal); } .del { color: var(--pink); }
  .ci { display: inline-flex; align-items: center; gap: 4px; }
  .ci i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
  .pt {
    margin-left: auto; padding: 6px 9px; border-radius: var(--r-xs); font: 800 11.5px/1 var(--font-ui); letter-spacing: 0.01em;
    color: var(--st); background: color-mix(in oklab, var(--st) 16%, #120d30); border: 1px solid color-mix(in oklab, var(--st) 45%, transparent);
  }
  .sheen {
    position: absolute; inset: 0; border-radius: var(--r-md); pointer-events: none; z-index: 4; opacity: 0; transition: opacity 0.3s;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 30%), rgb(255 255 255 / 0.16), transparent 45%),
      linear-gradient(115deg, transparent 30%, rgb(24 214 192 / 0.10) 45%, rgb(180 92 255 / 0.12) 55%, transparent 70%);
    mix-blend-mode: screen;
  }
  .card:hover .sheen { opacity: 1; }

  .card.done .art img { filter: grayscale(0.8) brightness(0.75); }
  .card.done .card-title h3 { color: var(--muted); }
  .card.done .frame { background: linear-gradient(155deg, #4a4180, #221a4d 50%, #3a3270); }
  .stamp {
    position: absolute; z-index: 3; left: 50%; top: 50%; translate: -50% -50%; rotate: -12deg;
    padding: 6px 14px; border: 2.5px solid var(--teal); border-radius: var(--r-xs); color: var(--teal);
    font: 800 16px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; background: rgb(8 6 26 / 0.5);
  }

/* ── Seeded randomness so every card always paints the same art ───── */

function seeded(text) {
  let h = 2166136261
  for (let i = 0; i < text.length; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619)
  return () => {
    h = Math.imul(h ^ (h >>> 15), 2246822507)
    h = Math.imul(h ^ (h >>> 13), 3266489909)
    return ((h ^= h >>> 16) >>> 0) / 4294967296
  }
}
const pick = (rand, list) => list[Math.floor(rand() * list.length)]

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16)
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255]
}
function shade(hex, amount, toward = [10, 6, 30]) {
  const c = hexToRgb(hex)
  return `rgb(${c.map((v, i) => Math.round(v + (toward[i] - v) * amount)).join(' ')})`
}
function color(hex, alpha = 1) {
  const c = getShaderColorFromString(hex)
  c[3] = alpha
  return c
}

/* ── Dithered art ──────────────────────────────────────────────────── */

/** Pattern families per kind: pull requests flow, steps wave, placeholders are sparse dots, and gates are planets. */
const SHAPES = {
  pr: ['warp', 'simplex', 'swirl'],
  step: ['wave', 'ripple', 'simplex'],
  placeholder: ['dots'],
  gate: ['sphere'],
  banner: ['warp', 'simplex', 'swirl', 'ripple'],
}

function layer(rand, shape, ink, alpha, px) {
  return {
    u_colorBack: [0, 0, 0, 0],
    u_colorFront: color(ink, alpha),
    u_shape: DitheringShapes[shape],
    u_type: DitheringTypes[pick(rand, ['4x4', '8x8', '8x8', 'random'])],
    u_pxSize: px,
    u_fit: 0,
    u_scale: shape === 'sphere' ? 0.9 + rand() * 0.25 : 0.45 + rand() * 0.9,
    u_rotation: rand() * 360,
    u_offsetX: shape === 'sphere' ? -0.15 + rand() * 0.3 : (rand() - 0.5) * 0.8,
    u_offsetY: shape === 'sphere' ? 0.1 + rand() * 0.15 : (rand() - 0.5) * 0.8,
    u_originX: 0.5, u_originY: 0.5, u_worldWidth: 0, u_worldHeight: 0,
    frame: rand() * 60000,
  }
}

/** Two dithered inks over a dark gradient: the base layer stays still, and the top layer comes alive on hover. */
function artSpec(seed, kind, inks) {
  const rand = seeded(seed)
  const [a, b] = inks
  const shapes = SHAPES[kind] ?? SHAPES.pr
  const top = kind === 'gate' ? 'ripple' : pick(rand, SHAPES.banner.filter((s) => s !== shapes[0]))
  return {
    angle: rand() * Math.PI * 2,
    back: [shade(a, 0.86), shade(b, 0.62)],
    base: layer(rand, pick(rand, shapes), a, kind === 'placeholder' ? 0.7 : 1, kind === 'placeholder' ? 3 : 2),
    top: layer(rand, top, b, kind === 'gate' ? 0.55 : 0.85, 2),
  }
}

const frame = () => new Promise((r) => requestAnimationFrame(r))

/** Browsers allow only a few WebGL contexts, so one hidden shader per size paints every still in turn. */
function makePainter(w, h) {
  const host = document.createElement('div')
  host.className = 'painter'
  Object.assign(host.style, { width: `${w}px`, height: `${h}px` })
  document.body.append(host)
  const mount = new ShaderMount(host, ditheringFragmentShader, layer(seeded(''), 'warp', '#ffffff', 1, 2), { preserveDrawingBuffer: true, premultipliedAlpha: true }, 0, 0, 2)
  const ready = (async () => {
    for (let i = 0; i < 90 && mount.canvasElement.width === 300; i++) await frame()
  })()
  let queue = ready
  const draw = (ctx, spec) => {
    const { frame: f, ...uniforms } = spec
    mount.setUniforms(uniforms)
    mount.setFrame(f)
    ctx.drawImage(mount.canvasElement, 0, 0, ctx.canvas.width, ctx.canvas.height)
  }
  return {
    w, h,
    /** Resolves to [base still, top still] as data URLs. */
    paint(spec, { split = false, round = false } = {}) {
      const job = queue.then(() => {
        const cw = mount.canvasElement.width, ch = mount.canvasElement.height
        const base = Object.assign(document.createElement('canvas'), { width: cw, height: ch })
        const ctx = base.getContext('2d')
        const r = Math.max(cw, ch)
        const g = ctx.createLinearGradient(cw / 2 - Math.cos(spec.angle) * r / 2, ch / 2 - Math.sin(spec.angle) * r / 2, cw / 2 + Math.cos(spec.angle) * r / 2, ch / 2 + Math.sin(spec.angle) * r / 2)
        g.addColorStop(0, spec.back[0]); g.addColorStop(1, spec.back[1])
        ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch)
        draw(ctx, spec.base)
        let top = null
        if (split) {
          const t = Object.assign(document.createElement('canvas'), { width: cw, height: ch })
          draw(t.getContext('2d'), spec.top)
          top = t.toDataURL('image/png')
        } else {
          draw(ctx, spec.top)
        }
        if (round) {
          ctx.globalCompositeOperation = 'destination-in'
          ctx.beginPath(); ctx.arc(cw / 2, ch / 2, cw / 2, 0, Math.PI * 2); ctx.fill()
        }
        return [base.toDataURL('image/png'), top]
      })
      queue = job.catch(() => {})
      return job
    },
  }
}

      <i class="glow"></i>
      <div class="frame"><div class="card-inner">
        <header class="card-title"><h3>${esc(card.title)}</h3>${card.pr ? `<span class="cost">#${card.pr}</span>` : ''}</header>
        <div class="art">
          <img class="art-base" alt=""><img class="art-top" alt="">
          ${card.st === 'done' ? '<span class="stamp">Merged</span>' : `<span class="art-status">${st.label}</span>`}
          ${card.repo ? `<span class="emblem"><i>${card.repo[0].toUpperCase()}</i>${card.repo}</span>` : ''}
        </div>
        <div class="typeline">${ICON[card.kind]}${typeName}${card.repo ? ` · ${card.repo}` : ''}<span class="gem"></span></div>
        <p class="text${card.text.length < 12 ? ' flavor' : ''}">${esc(card.text)}</p>
        <footer>${foot}<span class="pt">${card.st === 'done' ? 'Done' : st.label}</span></footer>
      </div></div>
      <i class="sheen"></i>
    </article>`
}

function render() {
  const world = $('#world')
  for (const f of FRAMES) {
    const g = GROUPS.find((x) => x.id === f.id)
    world.insertAdjacentHTML('beforeend', `
      <div class="group" style="left:${f.x}px; top:${f.y}px; width:${f.w}px; height:${f.h}px">
        <div class="group-banner"><img data-banner="${g.id}" alt=""></div>
        <div class="group-head">
          <div><h3>${esc(g.label)}</h3><p>${esc(g.blurb)}</p></div>
          <div class="prog">${g.done} / ${g.total} done<div class="bar"><i style="width:${(g.done / g.total) * 100}%"></i></div></div>
        </div>
      </div>`)
  }
  for (const c of CARDS) world.insertAdjacentHTML('beforeend', cardHtml(c))
  for (const n of NOTES) {
    world.insertAdjacentHTML('beforeend', `
      <div class="note" data-id="${n.id}" style="left:${n.x}px; top:${n.y}px">
        <div class="tape"><img data-tape="${n.id}" alt=""></div>
        <div class="body"><div class="label">✦ Note</div><p>${esc(n.text)}</p></div>
      </div>`)
  }

  $('#tiles').innerHTML = GROUPS.slice(0, 3).map((g) => `
    <article class="tile">
      <div class="tile-art"><img data-banner="${g.id}" alt=""><span class="tag">${TILE_TAGS[g.id]}</span></div>
      <div class="tile-body">
        <small>${g.done} of ${g.total} done</small>
        <h3>${esc(g.label)}</h3>
        <p>${esc(g.next)}</p>
        <div class="bar"><i style="width:${Math.max(3, (g.done / g.total) * 100)}%"></i></div>
      </div>
    </article>`).join('')

  const caret = '<svg class="caret" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4.5 3 3 3-3 3"/></svg>'
  const dotFor = (k) => ({
    ready: '<i class="dot" style="--c: var(--st-ready)"></i>',
    you: '<i class="dot lit" style="--c: var(--st-you)"></i>',
    review: '<i class="dot" style="--c: var(--st-review)"></i>',
    blocked: '<i class="dot" style="--c: var(--st-blocked)"></i>',
    expected: '<i class="dot hollow" style="--c: var(--st-expected)"></i>',
    wait: '<i class="dot wait" style="--c: var(--faint)"></i>',
  })[k]
  $('#groups').innerHTML = GROUPS.map((g) => {
    const kids = TREE[g.id]
    return `
    <div class="tree${kids ? ' open' : ''}">
      <button class="row">${caret}<span class="swatch"><img data-banner="${g.id}" alt=""></span><span class="label">${esc(g.label)}</span><span class="meta">${g.done}/${g.total}</span></button>
      ${kids ? `<div class="tree-kids">${kids.map((k) => `<button class="row${k.on ? ' on' : ''}">${dotFor(k.st)}<span class="label">${esc(k.label)}</span>${k.pr ? `<span class="meta">#${k.pr}</span>` : ''}</button>`).join('')}</div>` : ''}
    </div>`
  }).join('')

  const workspaces = [{ id: 'flipbook-release', inks: [INK.violet, INK.pink] }]
  drawEdges()
  return workspaces
}

function anchor(id, side) {
  const el = document.querySelector(`[data-id="${id}"]`)
  const x = el.offsetLeft, y = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight
  return { left: [x, y + h / 2], right: [x + w, y + h / 2], top: [x + w / 2, y], bottom: [x + w / 2, y + h] }[side]
}

function drawEdges() {
  const svg = $('#edges')
  let out = ''
  for (const e of EDGES) {
    const [sx, sy] = anchor(e.from, e.vertical ? 'top' : e.note ? 'left' : 'right')
    const [tx, ty] = anchor(e.to, e.vertical ? 'bottom' : e.note ? 'right' : 'left')
    const d = e.vertical
      ? `M${sx} ${sy - 4} L${tx} ${ty + 10}`
      : (() => {
          const dir = e.note ? -1 : 1
          const bend = Math.max(40, Math.abs(tx - sx) / 2)
          return `M${sx + 4 * dir} ${sy} C${sx + bend * dir} ${sy}, ${tx - bend * dir} ${ty}, ${tx - 10 * dir} ${ty}`
        })()
    if (e.cls === 'hot') out += `<path class="hot-base" d="${d}"/>`
    out += `<path class="${e.cls}" d="${d}"${e.cls === 'related' ? '' : ' marker-end="url(#arrow)"'}/>`
    if (e.cls === 'hot') out += `<path class="hot-flow" d="${d}"/>`
  }
  svg.insertAdjacentHTML('beforeend', out)
}

/* ── Paint every still ─────────────────────────────────────────────── */

const specs = new Map()

async function paintAll(workspaces) {
  for (const card of CARDS) {
    const spec = artSpec(card.id, card.kind, inksFor(card))
    specs.set(card.id, spec)
    const el = document.querySelector(`[data-id="${card.id}"]`)
    cardPainter.paint(spec, { split: true }).then(([base, top]) => {
      $('.art-base', el).src = base
      $('.art-top', el).src = top
    })
  }
  for (const n of NOTES) {
    bannerPainter.paint(artSpec(n.id, 'step', [INK.pink, INK.violet])).then(([src]) => ($(`[data-tape="${n.id}"]`).src = src))
  }
  for (const g of GROUPS) {
    const spec = artSpec(g.id, 'banner', g.inks)
    spec.back = [shade(g.inks[0], 0.8), shade(g.inks[2], 0.55)]
    bannerPainter.paint(spec).then(([src]) => document.querySelectorAll(`[data-banner="${g.id}"]`).forEach((img) => (img.src = src)))
  }
  bannerPainter.paint(artSpec('sync-promo', 'banner', [INK.teal, INK.violet])).then(([src]) => ($('[data-banner="sync-promo"]').src = src))
  for (const w of workspaces) {
    squarePainter.paint(artSpec(w.id, 'banner', w.inks)).then(([src]) => ($(`[data-ws="${w.id}"]`).src = src))
  }
  const sphere = (seed, inks) => {
    const s = artSpec(seed, 'gate', inks)
    s.base = { ...s.base, u_scale: 1.95, u_offsetX: 0, u_offsetY: 0 }
    s.top = { ...s.top, u_colorFront: color(inks[1], 0.35) }
    return s
  }
  squarePainter.paint(sphere('vocksel', [INK.teal, INK.violet]), { round: true }).then(([src]) => document.querySelectorAll('[data-avatar]').forEach((img) => (img.src = src)))
  ;[[INK.pink, INK.violet], [INK.teal, INK.blue], [INK.gold, INK.pink]].forEach((inks, i) => {
    squarePainter.paint(sphere(`planet-${i}`, inks), { round: true }).then(([src]) => ($(`[data-planet="${i}"]`).src = src))
  })
}

/* ── Live shaders: the hero, the canvas backdrop, and whichever card is hovered ── */

function live(host, spec, speed = 0) {
  const { frame: f, ...uniforms } = spec
  return new ShaderMount(host, ditheringFragmentShader, uniforms, { premultipliedAlpha: true }, speed, f, 1)
}

const heroSpec = layer(seeded('hero'), 'simplex', '#ff6fd8', 0.6, 3)
heroSpec.u_scale = 0.35
const hero = live($('#heroFx'), heroSpec)
const canvasSpec = layer(seeded('canvas'), 'warp', INK.violet, 0.22, 2)
canvasSpec.u_scale = 0.3
const backdrop = live($('#canvasFx'), canvasSpec)

const liveHost = document.createElement('div')
liveHost.className = 'live'
$('#park').append(liveHost)
const hover = new ShaderMount(liveHost, ditheringFragmentShader, (({ frame, ...u }) => u)(layer(seeded(''), 'warp', '#ffffff', 1, 2)), { premultipliedAlpha: true }, 0, 0, 2)

let motion = false
$('#motion').addEventListener('click', (e) => {
  motion = !motion
  e.currentTarget.setAttribute('aria-pressed', String(motion))
  hero.setSpeed(motion ? 0.25 : 0)
  backdrop.setSpeed(motion ? 0.12 : 0)
})

let hovered = null
function enter(card) {
  const spec = specs.get(card.dataset.id)
  if (!spec) return
  hovered = card
  const { frame: f, ...uniforms } = spec.top
  hover.setUniforms(uniforms)
  hover.setFrame(f)
  $('.art', card).insertBefore(liveHost, $('.art-status, .stamp', card))
  $('.art-top', card).style.opacity = '0'
  hover.setSpeed(0.6)
}
function leave(card) {
  hover.setSpeed(0)
  $('.art-top', card).style.opacity = ''
  $('#park').append(liveHost)
  card.style.removeProperty('--rx'); card.style.removeProperty('--ry')
  hovered = null
}

const world = $('#world')
world.addEventListener('pointerover', (e) => {
  const card = e.target.closest('.card')
  if (card && card !== hovered) { if (hovered) leave(hovered); enter(card) }
})
world.addEventListener('pointerout', (e) => {
  const card = e.target.closest('.card')
  if (card && !card.contains(e.relatedTarget)) leave(card)
})
world.addEventListener('pointermove', (e) => {
  const card = e.target.closest('.card')
  if (!card) return
  const r = card.getBoundingClientRect()
  const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height
  card.style.setProperty('--ry', `${(px - 0.5) * 10}deg`)
  card.style.setProperty('--rx', `${(0.5 - py) * 8}deg`)
  card.style.setProperty('--mx', `${px * 100}%`)
  card.style.setProperty('--my', `${py * 100}%`)
})

paintAll(render())
</script>

<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        const mode = localStorage.getItem('orion:color-mode')
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode
      } catch {
        // Storage can be unavailable; use the system color scheme.
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Orion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

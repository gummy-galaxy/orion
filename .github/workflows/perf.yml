name: Perf

# Drafts skip perf so the one perf machine isn't tied up measuring work in progress. Marking a pull request ready runs
# it. Every push to main that touches what perf measures runs it too, comparing against the commit before, so PostHog
# charts main with no gaps.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to a pull request replaces its pending run. Each commit on main keeps its own run, so none is skipped.
concurrency:
  group: perf-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Perf runs only when a change touches what it measures. A job skipped by its condition reports as skipped, which
  # still satisfies a required check, unlike a workflow skipped by `paths`. Required checks match by job name alone,
  # so this can't share CI's `ci-loading` name.
  perf-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      perf: ${{ steps.filter.outputs.perf }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  perf:
    needs: perf-loading
    if: needs.perf-loading.outputs.perf == 'true' && (github.event_name == 'push' || !github.event.pull_request.draft)
    # artemis, a machine that runs nothing but perf, has a single runner with this label, so measurements never share
    # the machine with another job.
    runs-on: perf
    # A fork's pull request waits for a maintainer to approve the perf-fork environment, since its code runs on
    # artemis. Pushes and pull requests from this repository's branches run right away.
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'perf-fork' || '' }}
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: workspace/orion-app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workspace/orion-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      # The runner account has no sudo, so Chromium's system libraries are installed on artemis ahead of time.
      - name: Install Chromium
        run: npx playwright install --only-shell chromium

      # For a pull request, the checkout is its merge commit, whose first parent is the base it was built on. Comparing
      # against that rather than origin/<base> keeps both sides in step when the base branch moves while this job
      # waits for the runner, since the base side runs this checkout's harness. On main, the first parent is the commit
      # before the push.
      - name: Compare Against the Base Branch
        run: npm run perf -- --base HEAD^1

      - name: Publish Report
        if: always() && job.status != 'cancelled' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATUS: ${{ job.status }}
        run: lute run perf-report

      # A fork's token can't comment, so the Perf Report workflow posts what this uploads.
      - name: Upload Report for Perf Report
        if: always() && job.status != 'cancelled' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: workspace/orion-app/.perf/report.md
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

      # Recording history is a side benefit, so a PostHog outage or missing token never fails the job.
      - name: Record Perf History
        if: success()
        continue-on-error: true
        working-directory: .
        env:
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: lute run perf-history

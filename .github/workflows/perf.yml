name: Perf

# Drafts skip perf so the one Beelink machine isn't tied up measuring work in progress. Marking a pull request ready
# runs it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - app/**
      - "!app/**/*.md"
      - "!app/**/*.test.ts"
      - "!app/**/*.test.tsx"
      - cli/.lute/perf-report.luau
      - .github/workflows/perf.yml

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf:
    if: ${{ !github.event.pull_request.draft }}
    # The Beelink's supervisor runs exclusive jobs one at a time on cores no other job uses, in rank order. The pin
    # label gives this job its own runner, so no other job can take it.
    runs-on: [exclusive, "pin-perf-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # The checkout is the pull request's merge commit, whose first parent is the base it was built on. Comparing
      # against that rather than origin/<base> keeps both sides in step when the base branch moves while this job
      # waits for the runner, since the base side runs this checkout's harness.
      - name: Compare Against the Base Branch
        run: npm run perf -- --base HEAD^1

      - name: Publish Report
        if: always() && job.status != 'cancelled'
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          STATUS: ${{ job.status }}
        run: lute run perf-report

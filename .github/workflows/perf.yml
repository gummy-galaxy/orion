name: Perf

on:
  pull_request:
    paths:
      - app/**
      - cli/.lute/perf-report.luau
      - .github/workflows/perf.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Luau Tools with Rokit
        uses: paradoxum-games/setup-rokit@c6a9749169e3a0146019b899cd0342556f773908 # v3
        with:
          version: 1.2.0
          path: cli

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Compare Against the Base Branch
        run: npm run perf -- --base origin/${{ github.event.pull_request.base.ref }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf
          path: |
            app/.perf/report.md
            app/.perf/raw.json
          if-no-files-found: ignore

      - name: Publish Report
        if: always() && job.status != 'cancelled'
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
          STATUS: ${{ job.status }}
        run: lute run perf-report

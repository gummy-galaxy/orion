name: Perf

# Compares one pull request's app performance against its base branch and publishes the report to the pull request.
# CI calls this workflow for pull requests that touch app/. Run it by hand to measure a pull request first, ahead of the
# queued runs: gh workflow run perf.yml -f pr=<n>

on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number to measure
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to measure
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: beelink
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      measured: ${{ steps.check.outputs.measured }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true
          path: cli

      - name: Resolve the Pull Request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: lute run perf-resolve

      - name: Check for an Existing Measurement
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ steps.resolve.outputs.head_sha }}
        run: lute run perf-check

  perf:
    needs: resolve
    # A head commit that already has a finished report never reaches this job, so it doesn't wait for a runner.
    if: needs.resolve.outputs.measured != 'true'
    # The pin label gives this job a runner of its own, which the Beelink's supervisor starts in priority order.
    # Exclusive keeps two perf runs from skewing each other's timings.
    runs-on: [exclusive, "pin-perf-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Dispatched runs measure the pull request's head. Pull request runs keep the merge commit they always measured.
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.resolve.outputs.head_sha || '' }}

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true
          path: cli

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Compare Against the Base Branch
        run: npm run perf -- --base origin/${{ needs.resolve.outputs.base_ref }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf
          path: |
            app/.perf/report.md
            app/.perf/raw.json
          if-no-files-found: ignore

      - name: Publish Report
        if: always() && job.status != 'cancelled'
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.resolve.outputs.head_sha }}
          STATUS: ${{ job.status }}
        run: lute run perf-report

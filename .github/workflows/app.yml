name: App

# The app's tests also read the token docs, the example theme, and the CLI's token contract to check they agree.

on:
  pull_request:
    paths: &paths
      - app/**
      - "!app/**/*.md"
      - docs/guide/tokens.md
      - examples/themes/**
      - cli/src/themes/tokenContract.luau
      - cli/.lute/coverage-report.luau
      - rokit.toml
      - .github/workflows/app.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: beelink
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run coverage

      - name: Install Luau Tools with Rokit
        if: github.event_name == 'pull_request'
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Publish Coverage
        if: github.event_name == 'pull_request'
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: lute run coverage-report

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload App
        if: github.ref == 'refs/heads/main'
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: orion-app
          path: app/dist
          retention-days: 1

name: CI

# Pull requests run only the jobs their changes touch. Pushes to main, the nightly schedule, and manual runs from the
# Actions tab run every job, so a job a pull request skipped still runs regularly.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its pending run. Every other run, such as a push to main or the nightly run,
# gets its own group, so a later merge never cancels it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # On a pull request, each job below runs only when a change touches what it builds or checks. A job skipped by its
  # condition reports as skipped, which still satisfies a required check, unlike a workflow skipped by `paths`.
  ci-loading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Other events skip the filter, which leaves its outputs empty, so every job runs
    outputs:
      cli: ${{ steps.filter.outputs.cli || 'true' }}
      app: ${{ steps.filter.outputs.app || 'true' }}
      desktop: ${{ steps.filter.outputs.desktop || 'true' }}
      changelog: ${{ steps.filter.outputs.changelog || 'true' }}
    steps:
      # Checked out for the filters file. Pull requests list their changed files through the API.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - name: Filter Changed Paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  cli-analysis:
    needs: ci-loading
    if: needs.ci-loading.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workspace/orion-cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Set Up Lute Type Definitions
        run: lute setup

      - name: Install Dependencies
        run: lute pkg install

      - name: Analyze
        run: lute run analyze
        working-directory: .

  cli:
    needs: ci-loading
    if: needs.ci-loading.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: workspace/orion-cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Move Home Beside the Checkout
        if: runner.os == 'Windows'
        run: lute run windows-home

      - name: Install Dependencies
        run: lute pkg install

      # The CLI's index specs run the `sqlite3` command, which the Linux and Windows images don't have
      - name: Install SQLite
        if: runner.os != 'macOS'
        run: lute run install-sqlite
        working-directory: .

      - name: Test
        run: lute test

      - name: Check the App's Geometry
        run: lute run geometry --check
        working-directory: .

      - name: Build
        run: lute run build
        working-directory: .

      - name: Smoke Test the Binary
        run: ./build/orion --help

      - name: Package
        run: lute run package
        working-directory: .

      - name: Upload CLI
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: workspace/orion-cli/build/orion-*.zip
          archive: false
          retention-days: 14

  app:
    needs: ci-loading
    if: needs.ci-loading.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: workspace/orion-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workspace/orion-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run coverage

      - name: Install Luau Tools with Rokit
        if: github.event_name == 'pull_request'
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Publish Coverage
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: lute run coverage-report

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload App
        if: github.ref == 'refs/heads/main'
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: orion-app
          path: workspace/orion-app/dist
          retention-days: 1

  desktop:
    needs: ci-loading
    if: needs.ci-loading.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    # A build without the Rust cache can take about 30 minutes
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Move Home Beside the Checkout
        if: runner.os == 'Windows'
        run: lute run windows-home

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            workspace/orion-app/package-lock.json
            workspace/orion-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: workspace/orion-desktop
          # Pull requests restore main's cache but don't save their own, since
          # each save uploads hundreds of megabytes into the shared cache quota
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Save even when a later step fails, so one failed main run doesn't leave
          # every pull request building from scratch
          cache-on-failure: true

      - name: Install Tauri System Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Luau Dependencies
        working-directory: workspace/orion-cli
        run: lute pkg install

      - name: Install App Dependencies
        working-directory: workspace/orion-app
        run: npm ci

      - name: Install Desktop Dependencies
        working-directory: workspace/orion-desktop
        run: npm ci

      - name: Check and Build
        run: lute run desktop

      - name: Upload Desktop Installer
        if: github.ref == 'refs/heads/main'
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: orion-desktop-${{ runner.os }}
          path: |
            workspace/orion-desktop/target/release/bundle/deb/*.deb
            workspace/orion-desktop/target/release/bundle/dmg/*.dmg
            workspace/orion-desktop/target/release/bundle/nsis/*.exe
          retention-days: 1

  changelog:
    needs: ci-loading
    if: needs.ci-loading.outputs.changelog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          # `changewrite check` diffs against the base branch, so it needs the full history
          fetch-depth: 0

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Check Changelog Entries
        run: changewrite check

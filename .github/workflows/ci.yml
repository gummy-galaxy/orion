name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Each job below runs only when a change touches what it builds or checks. A job skipped by its condition reports
  # as skipped, which still satisfies a required check, unlike a workflow skipped by `paths`.
  changes:
    runs-on: beelink
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      app: ${{ steps.filter.outputs.app }}
      docs: ${{ steps.filter.outputs.docs }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      # Pull requests list their files through the API, but pushes compare commits with git
      - uses: actions/checkout@v7
        if: github.event_name == 'push'

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # The app's tests read the token docs, the example theme, and the CLI's token contract to check they agree.
          # The docs reference is generated from the CLI, and the desktop build bundles the app and the CLI sidecar.
          filters: |
            cli:
              - "cli/**/!(*.md)"
              - .lute/**
              - .config.luau
              - rokit.toml
              - .github/workflows/ci.yml
            app:
              - "app/**/!(*.md)"
              - docs/guide/tokens.md
              - examples/themes/**
              - cli/src/themes/tokenContract.luau
              - cli/.lute/coverage-report.luau
              - rokit.toml
              - .github/workflows/ci.yml
            docs:
              - docs/**
              - "cli/**/!(*.md)"
              - .lute/docs.luau
              - .config.luau
              - rokit.toml
              - .github/workflows/ci.yml
            desktop:
              - "desktop/**/!(*.md)"
              - "app/**/!(*.md|*.test.ts|*.test.tsx|*.stories.tsx|*.bench.ts)"
              - "cli/**/!(*.md|*.spec.luau)"
              - rokit.toml
              - .github/workflows/ci.yml

  analysis:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: beelink
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Set Up Lute Type Definitions
        run: lute setup

      - name: Install Dependencies
        run: lute pkg install

      - name: Analyze
        run: lute run analyze

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Restore hosted runners when the repo is public. Until then, Linux jobs run on the self-hosted Beelink to save private minutes
        runner: [beelink] # [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Install Dependencies
        run: lute pkg install

      - name: Test
        run: lute test

      - name: Build
        run: lute run build

      - name: Smoke Test the Binary
        run: ./build/orion --help

      - name: Package
        run: lute run package

      - name: Upload CLI
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: cli/build/orion-*.zip
          archive: false
          retention-days: 14

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: beelink
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run coverage

      - name: Install Luau Tools with Rokit
        if: github.event_name == 'pull_request'
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Publish Coverage
        if: github.event_name == 'pull_request'
        working-directory: cli
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: lute run coverage-report

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload App
        if: github.ref == 'refs/heads/main'
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: orion-app
          path: app/dist
          retention-days: 1

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: beelink
    timeout-minutes: 5
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Luau Dependencies
        run: lute pkg install
        working-directory: cli

      - name: Install Dependencies
        run: npm ci

      - name: Check the Reference
        run: lute run docs --check
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Restore hosted runners when the repo is public. Until then, Linux jobs run on the self-hosted Beelink to save private minutes
        runner: [beelink] # [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    # A build without the Rust cache takes about 30 minutes on the Beelink's shared cores
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          # Pull requests restore main's cache but don't save their own, since
          # each save uploads hundreds of megabytes from the self-hosted runner
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Save even when a later step fails, so one failed main run doesn't leave
          # every pull request building from scratch
          cache-on-failure: true

      - name: Install Tauri System Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Luau Dependencies
        working-directory: cli
        run: lute pkg install

      - name: Install App Dependencies
        working-directory: app
        run: npm ci

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Check and Build
        working-directory: cli
        run: lute run desktop

      - name: Upload Desktop Installer
        if: github.ref == 'refs/heads/main'
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: orion-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

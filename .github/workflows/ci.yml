name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau tools with Rokit
        uses: paradoxum-games/setup-rokit@c6a9749169e3a0146019b899cd0342556f773908 # v3
        with:
          version: 1.2.0
          path: cli

      - name: Set up Lute type definitions
        run: lute setup

      - name: Install dependencies
        run: lute run install

      - name: Analyze
        run: lute run analyze

      - name: Test
        run: lute test

      - name: Build
        run: lute run build

      - name: Smoke test the binary
        run: ./build/orion --help

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau tools with Rokit
        uses: paradoxum-games/setup-rokit@c6a9749169e3a0146019b899cd0342556f773908 # v3
        with:
          version: 1.2.0
          path: cli

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: |
          (cd cli && lute run install)
          npm ci --prefix app
          npm ci --prefix desktop

      - name: Check formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      # Clippy compiles the shell, which needs the built canvas and the CLI sidecar in place.
      - name: Prepare the canvas and sidecar
        run: |
          npm --prefix app run build
          desktop/scripts/prepare-sidecar.sh

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        working-directory: desktop
        run: npx tauri build --no-bundle

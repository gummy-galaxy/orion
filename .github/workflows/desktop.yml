name: Desktop

# The desktop build bundles the app and the CLI sidecar, so changes to either rebuild it.

on:
  pull_request:
    paths: &paths
      - desktop/**
      - app/**
      - cli/**
      - "!**/*.md"
      - "!app/**/*.test.ts"
      - "!app/**/*.test.tsx"
      - "!app/**/*.stories.tsx"
      - "!cli/**/*.spec.luau"
      - rokit.toml
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        # Restore hosted runners when the repo is public. Until then, Linux jobs run on the self-hosted Beelink to save private minutes
        runner: [beelink] # [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    # A build without the Rust cache takes about 30 minutes on the Beelink's shared cores
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          # Pull requests restore main's cache but don't save their own, since
          # each save uploads hundreds of megabytes from the self-hosted runner
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Save even when a later step fails, so one failed main run doesn't leave
          # every pull request building from scratch
          cache-on-failure: true

      - name: Install Tauri System Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Luau Dependencies
        working-directory: cli
        run: lute pkg install

      - name: Install App Dependencies
        working-directory: app
        run: npm ci

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Check and Build
        working-directory: cli
        run: lute run desktop

      - name: Upload Desktop Installer
        if: github.ref == 'refs/heads/main'
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: orion-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

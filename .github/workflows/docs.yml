name: Docs

# Builds docs/ and deploys it to the orion-docs Cloudflare Pages project, which serves oriongraph.app. The Docs
# environment holds the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. Without the token, the deploy skips.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: beelink
    timeout-minutes: 5
    environment:
      name: Docs
      url: https://oriongraph.app
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - name: Check For Cloudflare Token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: 'if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::notice title=Docs deploy skipped::Add the CLOUDFLARE_API_TOKEN secret to the Docs environment to deploy the docs site."; fi'

      - name: Set Up Node
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Dependencies
        if: steps.token.outputs.enabled == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.enabled == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.token.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.150.0
          workingDirectory: docs
          # Deploying as main makes this the project's production deployment, which the custom domain serves.
          command: pages deploy .vitepress/dist --project-name=orion-docs --branch=main

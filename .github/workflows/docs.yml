name: Docs

# The reference pages are generated from the CLI's command table and MCP tool catalog, so CLI changes check them too.

on:
  pull_request:
    paths: &paths
      - docs/**
      - cli/**
      - "!cli/**/*.md"
      - .lute/docs.luau
      - .config.luau
      - rokit.toml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: beelink
    timeout-minutes: 5
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Luau Dependencies
        run: lute pkg install
        working-directory: cli

      - name: Install Dependencies
        run: npm ci

      - name: Check the Reference
        run: lute run docs --check
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

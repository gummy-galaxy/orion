name: Docs

# Builds docs/ and deploys it to the orion Cloudflare Worker, which serves oriongraph.app. Pushes to main deploy to
# production, and pull requests that change the docs upload a preview version, linked from the Docs Preview
# environment. Deploys need the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. Without the token, the deploy
# skips.

on:
  pull_request:
    paths: &paths
      - docs/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  # A pull request's preview keeps one alias across its pushes, so its address stays the same.
  PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
  # The Cloudflare account's workers.dev subdomain, which every preview address sits under.
  WORKERS_DEV_SUBDOMAIN: jolly-shadow-87e2

# A newer push to a pull request replaces its pending run. Each push to main gets its own group, so a later merge never cancels it.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: beelink
    timeout-minutes: 5
    environment:
      name: ${{ github.event_name == 'pull_request' && 'Docs Preview' || 'Docs' }}
      # Empty for a pull request whose upload skipped, so it never links an address that wasn't deployed.
      url: ${{ github.event_name != 'pull_request' && 'https://oriongraph.app' || (steps.deploy.outputs.deployment-url && format('https://{0}-orion.{1}.workers.dev', env.PREVIEW_ALIAS, env.WORKERS_DEV_SUBDOMAIN) || '') }}
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - name: Check For Cloudflare Token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: 'if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::notice title=Docs deploy skipped::Add the CLOUDFLARE_API_TOKEN secret to deploy the docs site."; fi'

      - name: Set Up Node
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Dependencies
        if: steps.token.outputs.enabled == 'true'
        run: npm ci

      - name: Build
        if: steps.token.outputs.enabled == 'true'
        run: npm run build

      - name: Deploy to Cloudflare
        if: steps.token.outputs.enabled == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.150.0
          workingDirectory: docs
          # A pull request uploads a version without deploying it, under its preview alias.
          command: ${{ github.event_name == 'pull_request' && format('versions upload --preview-alias {0}', env.PREVIEW_ALIAS) || 'deploy' }}

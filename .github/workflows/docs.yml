name: Docs

# Checks and builds docs/, then deploys it to the orion Cloudflare Worker, which serves oriongraph.app. Pushes to main
# deploy to production, and pull requests upload a preview version, linked from the Docs Preview environment. Deploys
# need the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets. Without the token, the deploy skips.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # A pull request's preview keeps one alias across its pushes, so its address stays the same.
  PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
  # The Cloudflare account's workers.dev subdomain, which every preview address sits under.
  WORKERS_DEV_SUBDOMAIN: jolly-shadow-87e2

# A newer push to a pull request replaces its pending run. Each push to main gets its own group, so a later merge never cancels it.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The docs jobs run only when a change touches what they build or check, read against the base branch for a pull
  # request and the commit before for a push to main. A job skipped by its condition reports as skipped, which still
  # satisfies a required check, unlike a workflow skipped by `paths`. Manual runs skip the filter and run every job.
  docs-loading:
    runs-on: beelink
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'

      - name: Filter Changed Paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml

  docs:
    needs: docs-loading
    if: needs.docs-loading.outputs.docs == 'true'
    runs-on: beelink
    timeout-minutes: 5
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Luau Dependencies
        run: lute pkg install
        working-directory: workspace/orion-cli

      - name: Install Dependencies
        run: npm ci

      - name: Check the Reference
        run: lute run docs --check
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: docs
    runs-on: beelink
    timeout-minutes: 5
    environment:
      name: ${{ github.event_name == 'pull_request' && 'Docs Preview' || 'Docs' }}
      # Empty for a pull request whose upload skipped, so it never links an address that wasn't deployed.
      url: ${{ github.event_name != 'pull_request' && 'https://oriongraph.app' || (steps.deploy.outputs.deployment-url && format('https://{0}-orion.{1}.workers.dev', env.PREVIEW_ALIAS, env.WORKERS_DEV_SUBDOMAIN) || '') }}
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check For Cloudflare Token
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: 'if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "::notice title=Docs deploy skipped::Add the CLOUDFLARE_API_TOKEN secret to deploy the docs site."; fi'

      - uses: actions/checkout@v7
        if: steps.token.outputs.enabled == 'true'

      - name: Set Up Node
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Dependencies
        if: steps.token.outputs.enabled == 'true'
        run: npm ci

      # Rebuilt here rather than passed from the docs job, since an artifact would count against the account's
      # Actions storage.
      - name: Build
        if: steps.token.outputs.enabled == 'true'
        run: npm run build

      - name: Deploy to Cloudflare
        if: steps.token.outputs.enabled == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.150.0
          workingDirectory: docs
          # A pull request uploads a version without deploying it, under its preview alias.
          command: ${{ github.event_name == 'pull_request' && format('versions upload --preview-alias {0}', env.PREVIEW_ALIAS) || 'deploy' }}

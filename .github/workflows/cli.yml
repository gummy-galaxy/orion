name: CLI

on:
  pull_request:
    paths: &paths
      - cli/**
      - "!cli/**/*.md"
      - .lute/**
      - .config.luau
      - rokit.toml
      - .github/workflows/cli.yml
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: beelink
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Set Up Lute Type Definitions
        run: lute setup

      - name: Install Dependencies
        run: lute pkg install

      - name: Analyze
        run: lute run analyze

  cli:
    strategy:
      fail-fast: false
      matrix:
        # Restore hosted runners when the repo is public. Until then, Linux jobs run on the self-hosted Beelink to save private minutes
        runner: [beelink] # [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true

      - name: Install Dependencies
        run: lute pkg install

      - name: Test
        run: lute test

      - name: Build
        run: lute run build

      - name: Smoke Test the Binary
        run: ./build/orion --help

      - name: Package
        run: lute run package

      - name: Upload CLI
        # A full artifact storage quota shouldn't fail the build
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: cli/build/orion-*.zip
          archive: false
          retention-days: 14

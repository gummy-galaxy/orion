name: Prioritize PR

# Labels a pull request priority-queue so the Beelink supervisor runs its queued perf job ahead of other work, then
# watches CI until the perf job starts and removes the label. Run it with: gh workflow run prioritize.yml -f pr=<n>
# The steps call .lute/priority-queue.luau, which loads the Lute batteries from the Loom store that `lute pkg install` fills.
run-name: "Prioritize #${{ inputs.pr }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to prioritize
        required: true
        type: string

permissions:
  contents: read

jobs:
  prioritize:
    # Runs on a hosted runner, since a Beelink runner waiting for CI would hold one of its two slots.
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Luau Tools with Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0
          cache: true
          path: cli

      - name: Install Luau Batteries
        working-directory: cli
        run: lute pkg install

      - name: Add the Priority Label
        id: add
        run: lute run priority-queue add --pr "$PR"

      - name: Watch the Perf Job
        run: lute run priority-queue watch --pr "$PR"

      - name: Remove the Priority Label
        if: always() && steps.add.outcome == 'success'
        run: lute run priority-queue remove --pr "$PR"

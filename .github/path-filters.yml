# Paths each CI job depends on, read by ci.yml's `ci-loading` job, docs.yml's `docs-loading` job, and perf.yml's
# `perf-loading` job through dorny/paths-filter. A job runs when a change matches its filter. The app's tests read the
# token docs, the example theme, and the CLI's token contract to check they agree. The docs reference is generated from
# the CLI, and the desktop build bundles the app and the CLI sidecar. The CLI checks the app's geometry module, which it
# generates. The changelog check runs only for changes to `workspace/`, so it leaves out the shared block.

# Every job reruns when the toolchain or the CI setup changes
shared: &shared
  - rokit.toml
  - .github/workflows/ci.yml
  - .github/path-filters.yml

cli:
  - *shared
  - "workspace/orion-cli/**/!(*.md)"
  - .lute/**
  - .config.luau
  - project.luau
  - workspace/orion-app/src/geometry.ts

app:
  - *shared
  - "workspace/orion-app/**/!(*.md)"
  - docs/guide/tokens.md
  - examples/themes/**
  - workspace/orion-cli/src/themes/tokenContract.luau
  - .lute/report/init.luau
  - .lute/report/coverage.luau

docs:
  - *shared
  - .github/workflows/docs.yml
  - docs/**
  - "workspace/orion-cli/**/!(*.md)"
  - .lute/generate/init.luau
  - .lute/generate/docs.luau
  - .config.luau

desktop:
  - *shared
  - "workspace/orion-desktop/**/!(*.md)"
  - "workspace/orion-app/**/!(*.md|*.test.ts|*.test.tsx|*.stories.tsx|*.bench.ts)"
  - "workspace/orion-cli/**/!(*.md|*.spec.luau)"
  - .lute/**
  - .config.luau
  - project.luau

changelog:
  - "workspace/**/!(*.md)"

# Perf measures the app, so it runs when the app or the perf tooling changes. Like the docs filter, it also applies to
# pushes to main, where changes are read against the commit before the push.
perf:
  - rokit.toml
  - .github/path-filters.yml
  - .github/workflows/perf.yml
  - "workspace/orion-app/**/!(*.md|*.test.ts|*.test.tsx)"
  - .lute/report/init.luau
  - .lute/report/perf.luau
  - .lute/report/perfHistory.luau
  - workspace/orion-cli/src/perf/**

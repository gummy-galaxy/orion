<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  html, body { margin: 0; background: #1c2440; }
  svg { display: block; }
</style>
<svg id="art" width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="8" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6"/>
    </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="5" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0 0.34  0 0 0 0.24 0" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="speck"/>
      <feBlend in="SourceGraphic" in2="speck" mode="multiply"/>
    </filter>
    <filter id="wash" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="2.6" fill="#f9e8c8"/></pattern>
  </defs>
  <g filter="url(#paper)">
    <rect width="1600" height="1000" fill="#1c2440"/>
    <g filter="url(#wobble)">
      <circle cx="1220" cy="260" r="260" fill="#33417a" filter="url(#wash)"/>
      <circle cx="300" cy="700" r="300" fill="#4b2f6b" filter="url(#wash)"/>
      <!-- Moon and stars -->
      <circle cx="1240" cy="210" r="96" fill="#f9e8c8"/>
      <circle cx="1210" cy="190" r="16" fill="#e8d2ad"/><circle cx="1270" cy="240" r="11" fill="#e8d2ad"/><circle cx="1250" cy="168" r="8" fill="#e8d2ad"/>
      <g fill="#f9e8c8">
        <circle cx="160" cy="120" r="4"/><circle cx="420" cy="80" r="3"/><circle cx="640" cy="160" r="4"/><circle cx="900" cy="70" r="3"/><circle cx="1460" cy="420" r="4"/>
        <circle cx="820" cy="300" r="3"/><circle cx="1060" cy="420" r="3"/><circle cx="260" cy="320" r="3"/><circle cx="1500" cy="120" r="3"/>
      </g>
      <!-- A stack of cards like a little tower, each a different status color -->
      <g transform="translate(700 980)">
        <rect x="-170" y="-150" width="340" height="150" rx="18" fill="#3ec4b5"/>
        <rect x="-150" y="-128" width="80" height="80" rx="16" fill="#1c2440"/><path d="M-128 -88 l14 14 l26 -30" fill="none" stroke="#f9e8c8" stroke-width="8" stroke-linecap="round"/>
        <rect x="-50" y="-112" width="190" height="16" rx="8" fill="#1c2440" opacity="0.6"/><rect x="-50" y="-82" width="130" height="16" rx="8" fill="#1c2440" opacity="0.4"/>
        <g transform="translate(14 -150) rotate(-4)">
          <rect x="-160" y="-140" width="320" height="140" rx="18" fill="#f7b538"/>
          <rect x="-140" y="-118" width="74" height="74" rx="15" fill="#1c2440"/>
          <rect x="-48" y="-104" width="180" height="16" rx="8" fill="#1c2440" opacity="0.6"/><rect x="-48" y="-74" width="110" height="16" rx="8" fill="#1c2440" opacity="0.4"/>
          <g transform="translate(-8 -140) rotate(7)">
            <rect x="-150" y="-130" width="300" height="130" rx="18" fill="#f2547d"/>
            <rect x="-130" y="-110" width="70" height="70" rx="14" fill="#1c2440"/>
            <rect x="-44" y="-96" width="170" height="16" rx="8" fill="#1c2440" opacity="0.6"/><rect x="-44" y="-66" width="100" height="16" rx="8" fill="#1c2440" opacity="0.4"/>
            <!-- Done stamp on the top card -->
            <g transform="translate(60 -40) rotate(-12)"><rect x="-70" y="-24" width="140" height="48" rx="8" fill="none" stroke="#f9e8c8" stroke-width="6"/><text x="0" y="12" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="30" letter-spacing="5" fill="#f9e8c8">DONE</text></g>
          </g>
        </g>
      </g>
      <!-- The companion perched on top, mid-hop with a happy squint -->
      <g transform="translate(690 420)">
        <ellipse cx="0" cy="190" rx="70" ry="12" fill="#1c2440" opacity="0.35"/>
        <path d="M-30 20 C-70 70 -120 70 -150 30" fill="none" stroke="#f9e8c8" stroke-width="7" stroke-linecap="round"/>
        <path d="M30 20 C70 70 120 70 150 10" fill="none" stroke="#f9e8c8" stroke-width="7" stroke-linecap="round"/>
        <path d="M-160 -30 L-153 18 L-126 30 L-153 42 L-160 90 L-167 42 L-194 30 L-167 18 Z" fill="#f9e8c8"/>
        <path d="M160 -60 L167 -12 L194 0 L167 12 L160 60 L153 12 L126 0 L153 -12 Z" fill="#f9e8c8"/>
        <path d="M0 -160 L20 -28 L92 0 L20 28 L0 160 L-20 28 L-92 0 L-20 -28 Z" fill="#fff6ea"/>
        <circle r="60" fill="#fff6ea"/>
        <path d="M-32 -6 Q-22 -18 -12 -6" fill="none" stroke="#1c2440" stroke-width="6" stroke-linecap="round"/>
        <path d="M12 -6 Q22 -18 32 -6" fill="none" stroke="#1c2440" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="-38" cy="12" rx="11" ry="7" fill="#f78fc6"/><ellipse cx="38" cy="12" rx="11" ry="7" fill="#f78fc6"/>
        <path d="M-10 14 Q0 26 10 14" fill="#1c2440"/>
        <!-- Sparkles of a finish -->
        <g fill="#f7d33c"><path d="M120 -150 l7 18 l18 7 l-18 7 l-7 18 l-7 -18 l-18 -7 l18 -7 Z"/><path d="M-140 -120 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5 Z"/><path d="M60 -220 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/></g>
      </g>
      <!-- Little planets drifting by -->
      <g transform="translate(260 300)"><circle r="70" fill="#f2547d"/><circle r="70" fill="url(#dots)" opacity="0.4"/><path d="M-120 10 Q0 50 120 -10" fill="none" stroke="#f7d33c" stroke-width="10" stroke-linecap="round"/></g>
      <g transform="translate(1180 640)"><circle r="110" fill="#3ec4b5"/><path d="M-110 0 A110 110 0 0 0 110 0 C70 30 -70 30 -110 0 Z" fill="#2f9f95"/>
        <g transform="translate(-20 -108)"><rect x="-22" y="-40" width="44" height="40" fill="#f9e8c8"/><path d="M-30 -38 L0 -66 L30 -38 Z" fill="#f2547d"/></g>
        <g transform="translate(50 -96) rotate(18)"><rect x="-3" y="-50" width="6" height="50" fill="#f9e8c8"/><circle cy="-62" r="20" fill="#f7d33c"/></g>
      </g>
      <g transform="translate(1440 820)"><path d="M-50 40 C-50 -10 -28 -44 0 -44 C28 -44 50 -10 50 40 Q0 50 -50 40 Z" fill="#f7d33c"/></g>
      <!-- Ground -->
      <path d="M0 900 C300 860 560 920 820 890 C1100 856 1320 900 1600 870 L1600 1000 L0 1000 Z" fill="#33417a"/>
    </g>
    <text x="80" y="940" font-family="Fraunces, serif" font-weight="600" font-size="34" fill="#f9e8c8" font-style="italic">and when the last card was done, the little star did a hop.</text>
  </g>
</svg>
